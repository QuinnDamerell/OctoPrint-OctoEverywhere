name: Web Lint & Template Check

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript lint dependencies
        run: npm ci

      - name: Lint JavaScript and CSS
        run: npm run lint

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install template lint dependencies
        run: python -m pip install "djlint==1.44.2" "Jinja2==3.1.6"

      - name: Validate Jinja2 syntax
        run: python scripts/check_jinja_templates.py

      - name: Lint Jinja2 templates
        run: python -m djlint --lint --use-gitignore .
