name: Docker Build & Compression Check

# Check the actual Alpine/Python/native dependency combination before merging a bump.
on:
  push:
    branches:
      - docker-build
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - octoeverywhere/compression.py
      - octoeverywhere/zstandarddictionary.py
      - tests/test_compression_compatibility.py
      - .github/workflows/docker-build-test.yml

permissions:
  contents: read

jobs:
  build:
    name: Test Docker (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/386, linux/arm/v6, linux/arm/v7, linux/arm64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A local build needs no registry credentials, including on Dependabot PRs.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          file: ./Dockerfile
          push: false
          load: true
          tags: octoeverywhere:test

      - name: Verify native compression and protocol compatibility
        run: |
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint /app/octoeverywhere-env/bin/python octoeverywhere:test -c "import sys, zstandard; print(sys.version); print(zstandard.__version__, zstandard.ZSTD_VERSION)"
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint /app/octoeverywhere-env/bin/python octoeverywhere:test -m unittest discover -s tests -p test_compression_compatibility.py -v
